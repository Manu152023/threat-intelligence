# Default: in-memory H2 (no setup needed). Docker Compose overrides these with MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:threatintel}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
management.endpoints.web.exposure.include=health
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
